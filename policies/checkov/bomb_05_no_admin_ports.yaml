metadata:
  id: "CKV2_BOMB_5"
  name: "Estándar RS-04: ninguna regla de entrada puede abrir SSH (22) ni RDP (3389)"
  category: "NETWORKING"
definition:
  and:
    - cond_type: "attribute"
      resource_types:
        - "aws_vpc_security_group_ingress_rule"
      attribute: "from_port"
      operator: "not_equals"
      value: 22
    - cond_type: "attribute"
      resource_types:
        - "aws_vpc_security_group_ingress_rule"
      attribute: "from_port"
      operator: "not_equals"
      value: 3389
