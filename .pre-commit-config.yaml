# Controles locales antes de cada commit: el error se detecta en el equipo del
# integrante y no llega al repositorio. Instalación: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: check-added-large-files

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: ["--hook-config=--retry-once-with-cleanup=true"]
      - id: terraform_tflint
        args: ["--args=--config=__GIT_WORKING_DIR__/.tflint.hcl"]
      - id: terraform_checkov
        args: ["--args=--config-file __GIT_WORKING_DIR__/.checkov.yaml"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["-S", "warning"]

  - repo: local
    hooks:
      - id: trazabilidad
        name: trazabilidad requerimiento-prueba
        entry: python3 scripts/check_traceability.py
        language: system
        pass_filenames: false
        files: ^(tests/|docs/01-requerimientos\.md|scripts/smoke_test\.sh)
