# Integración continua en GitHub: replica la etapa validate de CodeBuild en cada push y
# pull request. No usa credenciales de AWS (las pruebas unitarias usan proveedor simulado).
name: ci

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"

jobs:
  calidad-y-seguridad:
    name: Formato, lint, secretos y políticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks revisa todo el historial

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

      - name: checkov
        run: |
          pip install --quiet checkov==3.2.334
          checkov --config-file .checkov.yaml

      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

  pruebas-unitarias:
    name: terraform test
    runs-on: ubuntu-latest
    needs: calidad-y-seguridad
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform test
        run: |
          terraform init -backend=false -input=false
          mkdir -p reports
          terraform test -junit-xml=reports/terraform-test.xml

      - name: pruebas estáticas del repositorio
        run: |
          pip install --quiet "pytest>=8.3,<9"
          python -m pytest tests/static -v --junitxml=reports/static.xml

      - name: trazabilidad requerimiento → prueba
        run: |
          python scripts/check_traceability.py
          cat reports/trazabilidad.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-terraform-test
          path: reports/

  pruebas-integracion:
    # Manual y solo con cuenta propia: usa OIDC (credenciales temporales, sin llaves en GitHub).
    # En AWS Academy se usa el proyecto CodeBuild de integración.
    name: Pruebas de integración (cuenta AWS)
    if: github.event_name == 'workflow_dispatch' && vars.AWS_INTEGRATION_ROLE_ARN != ''
    runs-on: ubuntu-latest
    needs: pruebas-unitarias
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INTEGRATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: pytest
        env:
          TF_OUTPUTS_FILE: outputs.json
        run: |
          pip install --quiet -r tests/integration/requirements.txt
          aws s3 cp "s3://${{ vars.OUTPUTS_BUCKET }}/outputs.json" outputs.json
          python -m pytest tests/integration -v --junitxml=reports/integration.xml
